    </linearGradient>
    <linearGradient id="wave" x1="1193" y1="240" x2="1484" y2="297" gradientUnits="userSpaceOnUse">
      <stop stop-color="#267B61"/><stop offset="1" stop-color="#74B69B"/>
    </linearGradient>
    <filter id="shadow" x="-.15" y="-.2" width="1.3" height="1.5" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#29543D" flood-opacity=".06"/>
    </filter>
    <clipPath id="canvas"><rect x="1" y="1" width="1598" height="578" rx="26"/></clipPath>
  </defs>
