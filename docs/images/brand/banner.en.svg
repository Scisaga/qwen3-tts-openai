<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-TTS OpenAI · Voice cloning and director-script narration</title>
  <desc id="desc">A light banner for a self-hosted voice studio. Reference audio and a director script feed Qwen3-TTS to produce downloadable MP3 and WAV narration. Reuse voices, plan pages and segments, and connect apps and agents.</desc>
